<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="psx-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04261d"/>
      <stop offset="50%" stop-color="#061a15"/>
      <stop offset="100%" stop-color="#020f0c"/>
    </linearGradient>

    <!-- Radial Emerald Glow -->
    <radialGradient id="psx-glow" cx="75%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>

    <!-- Border Gradient -->
    <linearGradient id="psx-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Candlestick Bar Gradients -->
    <linearGradient id="bar-1" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="bar-2" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="bar-3" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="bar-4" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <!-- Container Badge -->
  <rect width="64" height="64" rx="15" fill="url(#psx-bg)"/>
  <rect width="64" height="64" rx="15" fill="url(#psx-glow)"/>
  <rect x="1" y="1" width="62" height="62" rx="14" fill="none" stroke="url(#psx-border)" stroke-width="1.5"/>

  <!-- Ascending PSX Market Bars -->
  <rect x="14.5" y="23" width="5.5" height="11" rx="2" fill="url(#bar-1)"/>
  <rect x="24.5" y="18" width="5.5" height="16" rx="2" fill="url(#bar-2)"/>
  <rect x="34.5" y="13" width="5.5" height="21" rx="2" fill="url(#bar-3)"/>
  <rect x="44.5" y="8"  width="5.5" height="26" rx="2" fill="url(#bar-4)"/>

  <!-- Dynamic Bull Surge Trendline -->
  <path d="M11 26 L23 20 L33 15 L46.5 7" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
  <polygon points="51,4.5 45,5.5 48.5,9" fill="#ffffff"/>
  <circle cx="50" cy="5" r="1.8" fill="#38bdf8"/>

  <!-- High-Contrast Crisp PSX Monogram -->
  <text x="32" y="54" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
    font-size="14.5" 
    font-weight="900" 
    letter-spacing="1.5" 
    fill="#ffffff" 
    text-anchor="middle">PSX</text>
</svg>